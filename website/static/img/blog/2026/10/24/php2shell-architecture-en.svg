<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Mitigating PHP2Shell at ingress</title><desc id="desc">Direct exposure compared with APISIX rejecting rule matches before they reach PHP. Normal requests continue; origin access is restricted and PHP still needs patching.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1400" height="850" rx="18" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="48" y="65" font-size="36" fill="#172b43" font-weight="700" text-anchor="start">Protect the ingress while you patch PHP</text><text x="48" y="105" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">APISIX rejects requests that match the configured rules; PHP still needs its security updates.</text><rect x="38" y="142" width="1324" height="230" rx="18" fill="#fff0f1" stroke="none" stroke-width="2"/><text x="65" y="185" font-size="25" fill="#aa3544" font-weight="700" text-anchor="start">Directly exposed service</text><rect x="70" y="220" width="180" height="95" rx="18" fill="#fff" stroke="#d9a9af" stroke-width="2"/><text x="160" y="275" font-size="26" fill="#8f4251" font-weight="700" text-anchor="middle">Client</text><path d="M275 265H1080" fill="none" stroke="#d74d5a" stroke-width="5" marker-end="url(#arrow)"/><text x="675" y="238" font-size="25" fill="#aa3544" font-weight="700" text-anchor="middle">Malicious requests reach PHP</text><rect x="1110" y="220" width="210" height="95" rx="18" fill="#fff" stroke="#d9a9af" stroke-width="2"/><text x="1215" y="275" font-size="30" fill="#8f4251" font-weight="700" text-anchor="middle">PHP</text><text x="1215" y="345" font-size="20" fill="#8f4251" font-weight="400" text-anchor="middle">Vulnerable service</text><rect x="38" y="395" width="1324" height="337" rx="18" fill="#eaf3ff" stroke="none" stroke-width="2"/><text x="65" y="438" font-size="25" fill="#275e9f" font-weight="700" text-anchor="start">APISIX ingress controls</text><rect x="70" y="535" width="180" height="95" rx="18" fill="#fff" stroke="#a2bddb" stroke-width="2"/><text x="160" y="590" font-size="26" fill="#275e9f" font-weight="700" text-anchor="middle">Client</text><path d="M275 580H520" fill="none" stroke="#3676bf" stroke-width="5" marker-end="url(#arrow)"/><text x="397" y="550" font-size="22" fill="#275e9f" font-weight="400" text-anchor="middle">Requests</text><rect x="540" y="500" width="310" height="145" rx="18" fill="#fff" stroke="#3676bf" stroke-width="2"/><text x="695" y="545" font-size="31" fill="#275e9f" font-weight="700" text-anchor="middle">APISIX</text><text x="695" y="582" font-size="22" fill="#275e9f" font-weight="400" text-anchor="middle">Serverless rules</text><text x="695" y="615" font-size="22" fill="#275e9f" font-weight="400" text-anchor="middle">or Coraza WAF</text><path d="M850 530H930V475H1015" fill="none" stroke="#d74d5a" stroke-width="5"/><rect x="1015" y="451" width="70" height="48" rx="18" fill="#d74d5a" stroke="none" stroke-width="2"/><text x="1050" y="484" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">STOP</text><text x="958" y="437" font-size="23" fill="#aa3544" font-weight="700" text-anchor="middle">Rule match</text><path d="M850 615H1045V555H1100" fill="none" stroke="#269375" stroke-width="5" marker-end="url(#arrow)"/><text x="950" y="685" font-size="23" fill="#20785f" font-weight="700" text-anchor="middle">Normal requests</text><rect x="1110" y="500" width="210" height="95" rx="18" fill="#fff" stroke="#a2bddb" stroke-width="2"/><text x="1215" y="555" font-size="30" fill="#275e9f" font-weight="700" text-anchor="middle">PHP</text><text x="1215" y="630" font-size="19" fill="#52657a" font-weight="400" text-anchor="middle">Still requires patching</text><text x="1215" y="660" font-size="18" fill="#52657a" font-weight="400" text-anchor="middle">Trust gateway ingress only</text><text x="50" y="792" font-size="25" fill="#275e9f" font-weight="700" text-anchor="start">Temporary ingress controls → time to apply and validate the PHP security updates</text></g></svg>