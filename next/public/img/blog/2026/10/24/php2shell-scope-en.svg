<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Three policy attachment scopes</title><desc id="desc">A Global Rule covers the gateway, a Service covers associated routes, and a Route covers a selected route. Blue indicates where this policy applies.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1400" height="850" rx="18" fill="#f7f9fc" stroke="none" stroke-width="2"/><text x="48" y="65" font-size="36" fill="#172b43" font-weight="700" text-anchor="start">Choose where the policy applies</text><text x="48" y="105" font-size="23" fill="#52657a" font-weight="400" text-anchor="start">Attach the plugin configuration at one of these three scopes.</text><rect x="38" y="145" width="430" height="575" rx="18" fill="#fff" stroke="#dce3ed" stroke-width="2"/><text x="63" y="193" font-size="30" fill="#275e9f" font-weight="700" text-anchor="start">Global Rule</text><text x="63" y="235" font-size="22" fill="#172b43" font-weight="700" text-anchor="start">Across the gateway</text><rect x="58" y="267" width="390" height="375" rx="18" fill="#eaf3ff" stroke="#3676bf" stroke-width="2"/><text x="78" y="307" font-size="23" fill="#275e9f" font-weight="700" text-anchor="start">APISIX gateway</text><rect x="80" y="332" width="346" height="126" rx="18" fill="#e1efff" stroke="#8cafd5" stroke-width="2"/><text x="98" y="366" font-size="23" fill="#275e9f" font-weight="700" text-anchor="start">Service A</text><rect x="98" y="387" width="142" height="49" rx="10" fill="#3676bf" stroke="none" stroke-width="2"/><text x="169" y="419" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">API 1</text><rect x="255" y="387" width="142" height="49" rx="10" fill="#3676bf" stroke="none" stroke-width="2"/><text x="326" y="419" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">API 2</text><rect x="80" y="477" width="346" height="126" rx="18" fill="#e1efff" stroke="#8cafd5" stroke-width="2"/><text x="98" y="511" font-size="23" fill="#275e9f" font-weight="700" text-anchor="start">Service B</text><rect x="98" y="532" width="142" height="49" rx="10" fill="#3676bf" stroke="none" stroke-width="2"/><text x="169" y="564" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">API 3</text><rect x="255" y="532" width="142" height="49" rx="10" fill="#3676bf" stroke="none" stroke-width="2"/><text x="326" y="564" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">API 4</text><text x="253" y="684" font-size="19" fill="#52657a" font-weight="400" text-anchor="middle">Bind to a Global Rule</text><rect x="485" y="145" width="430" height="575" rx="18" fill="#fff" stroke="#dce3ed" stroke-width="2"/><text x="510" y="193" font-size="30" fill="#275e9f" font-weight="700" text-anchor="start">Service</text><text x="510" y="235" font-size="22" fill="#172b43" font-weight="700" text-anchor="start">Routes using this Service</text><rect x="505" y="267" width="390" height="375" rx="18" fill="#f7f9fc" stroke="#cdd6e2" stroke-width="2"/><text x="525" y="307" font-size="23" fill="#64758a" font-weight="700" text-anchor="start">APISIX gateway</text><rect x="527" y="332" width="346" height="126" rx="18" fill="#e1efff" stroke="#8cafd5" stroke-width="2"/><text x="545" y="366" font-size="23" fill="#275e9f" font-weight="700" text-anchor="start">Service A</text><rect x="545" y="387" width="142" height="49" rx="10" fill="#3676bf" stroke="none" stroke-width="2"/><text x="616" y="419" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">API 1</text><rect x="702" y="387" width="142" height="49" rx="10" fill="#3676bf" stroke="none" stroke-width="2"/><text x="773" y="419" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">API 2</text><rect x="527" y="477" width="346" height="126" rx="18" fill="#f0f3f7" stroke="#d8dfe9" stroke-width="2"/><text x="545" y="511" font-size="23" fill="#7e8b9a" font-weight="700" text-anchor="start">Service B</text><rect x="545" y="532" width="142" height="49" rx="10" fill="#e2e7ee" stroke="none" stroke-width="2"/><text x="616" y="564" font-size="22" fill="#8591a1" font-weight="700" text-anchor="middle">API 3</text><rect x="702" y="532" width="142" height="49" rx="10" fill="#e2e7ee" stroke="none" stroke-width="2"/><text x="773" y="564" font-size="22" fill="#8591a1" font-weight="700" text-anchor="middle">API 4</text><text x="700" y="684" font-size="19" fill="#52657a" font-weight="400" text-anchor="middle">Bind to Service A</text><rect x="932" y="145" width="430" height="575" rx="18" fill="#fff" stroke="#dce3ed" stroke-width="2"/><text x="957" y="193" font-size="30" fill="#275e9f" font-weight="700" text-anchor="start">Route</text><text x="957" y="235" font-size="22" fill="#172b43" font-weight="700" text-anchor="start">One selected route</text><rect x="952" y="267" width="390" height="375" rx="18" fill="#f7f9fc" stroke="#cdd6e2" stroke-width="2"/><text x="972" y="307" font-size="23" fill="#64758a" font-weight="700" text-anchor="start">APISIX gateway</text><rect x="974" y="332" width="346" height="126" rx="18" fill="#f0f3f7" stroke="#d8dfe9" stroke-width="2"/><text x="992" y="366" font-size="23" fill="#7e8b9a" font-weight="700" text-anchor="start">Service A</text><rect x="992" y="387" width="142" height="49" rx="10" fill="#3676bf" stroke="none" stroke-width="2"/><text x="1063" y="419" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">API 1</text><rect x="1149" y="387" width="142" height="49" rx="10" fill="#e2e7ee" stroke="none" stroke-width="2"/><text x="1220" y="419" font-size="22" fill="#8591a1" font-weight="700" text-anchor="middle">API 2</text><rect x="974" y="477" width="346" height="126" rx="18" fill="#f0f3f7" stroke="#d8dfe9" stroke-width="2"/><text x="992" y="511" font-size="23" fill="#7e8b9a" font-weight="700" text-anchor="start">Service B</text><rect x="992" y="532" width="142" height="49" rx="10" fill="#e2e7ee" stroke="none" stroke-width="2"/><text x="1063" y="564" font-size="22" fill="#8591a1" font-weight="700" text-anchor="middle">API 3</text><rect x="1149" y="532" width="142" height="49" rx="10" fill="#e2e7ee" stroke="none" stroke-width="2"/><text x="1220" y="564" font-size="22" fill="#8591a1" font-weight="700" text-anchor="middle">API 4</text><text x="1147" y="684" font-size="19" fill="#52657a" font-weight="400" text-anchor="middle">Bind to the Route for API 1</text><rect x="48" y="765" width="20" height="20" rx="10" fill="#3676bf" stroke="none" stroke-width="2"/><text x="80" y="783" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">Policy applies</text><rect x="335" y="765" width="20" height="20" rx="10" fill="#d3dae4" stroke="none" stroke-width="2"/><text x="367" y="783" font-size="22" fill="#52657a" font-weight="400" text-anchor="start">Policy not attached</text><text x="1350" y="783" font-size="22" fill="#52657a" font-weight="400" text-anchor="end">Three independent choices</text></g></svg>