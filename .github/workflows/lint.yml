name: ❄️ Lint

on: [pull_request]

jobs:
  astro-main-pages:
    name: Astro main pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: next/package-lock.json
      - name: Install dependencies
        working-directory: next
        run: npm ci
      - name: Sync site content
        working-directory: next
        run: node scripts/sync-content.mjs
        env:
          WEBSITE_REPO: ${{ github.workspace }}
      - name: Build Astro site
        working-directory: next
        run: npm run build
      - name: Test main pages on desktop and mobile
        working-directory: next
        run: npm run test:e2e
  markdownlint:
    name: 🍇 Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - name: 🚀 Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '12.x'
      - run: npm install -g markdownlint-cli@0.25.0
      - run: markdownlint '**/*.md' --ignore node_modules
  frontmatter:
    name: 🍒 Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - name: 🚀 Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn lint:frontmatter
  yamllint:
    name: 🍏 YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - uses: actions/setup-python@v4.1.0
        with:
          python-version: '3.x'  # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64'  # optional x64 or x86. Defaults to x64 if not specified
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
      - name: 🧹 YAML Lint
        run: |
          yamllint .
