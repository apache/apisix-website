name: ❄️ Lint

on: [pull_request]

jobs:
  astro-main-pages:
    name: Astro main pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.1.0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: next/package-lock.json
      - name: Install dependencies
        working-directory: next
        run: npm ci
      - name: Test sitemap generation
        working-directory: next
        run: npm run test:sitemap
      - name: Sync site content
        working-directory: next
        run: node scripts/sync-content.mjs
        env:
          WEBSITE_REPO: ${{ github.workspace }}
      - name: Build Astro site
        working-directory: next
        run: npm run build
      - name: Assert Chinese learning-center retirement contract
        working-directory: next
        run: |
          set -euo pipefail
          node scripts/generate-md-twins.mjs
          test -f dist/zh/learning-center/index.html
          test "$(find dist/zh/learning-center -name index.html | wc -l)" -eq 1
          test "$(find dist/zh/learning-center -name index.md | wc -l)" -eq 0
          if grep -Eq 'https://apisix\.apache\.org/zh/learning-center/.+/index\.md' dist/llms.txt; then
            echo 'Retired Chinese learning-center Markdown URL remains in llms.txt.'
            exit 1
          fi
      - name: Test main pages on desktop and mobile
        working-directory: next
        run: npm run test:e2e
  markdownlint:
    name: 🍇 Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: 🚀 Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '12.x'
      - run: npm install -g markdownlint-cli@0.25.0
      - run: markdownlint '**/*.md' --ignore node_modules
  frontmatter:
    name: 🍒 Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: 🚀 Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16.x'
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn lint:frontmatter
  yamllint:
    name: 🍏 YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v4.1.0
        with:
          python-version: '3.x'  # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64'  # optional x64 or x86. Defaults to x64 if not specified
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
      - name: 🧹 YAML Lint
        run: |
          yamllint .
